name: Build reviewed CommDDL update PR
on:
  repository_dispatch:
    types: [commddl_review_batch]
permissions:
  contents: read
jobs:
  build-pr:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Load approved review decisions
        env:
          UPDATE_ADMIN_API_URL: ${{ vars.UPDATE_ADMIN_API_URL }}
          UPDATE_INTERNAL_HMAC_SECRET: ${{ secrets.UPDATE_INTERNAL_HMAC_SECRET }}
          BATCH_ID: ${{ github.event.client_payload.batchId }}
        run: node scripts/updates/service-client.cjs export-batch --id "$BATCH_ID" --directory /tmp/commddl-review
      - name: Verify dispatched batch version
        env:
          BATCH_VERSION: ${{ github.event.client_payload.version }}
        run: node -e "const m=require('/tmp/commddl-review/metadata.json');if(m.version!==Number(process.env.BATCH_VERSION)||m.status!=='building-pr')process.exit(1)"
      - name: Apply reviewed source changes
        run: node scripts/updates/apply.cjs --batch /tmp/commddl-review/candidate.json --decisions /tmp/commddl-review/decisions.json
      - name: Verify the exact data PR boundary
        run: node scripts/updates/verify-data-pr-paths.cjs
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.UPDATE_GITHUB_APP_ID }}
          private-key: ${{ secrets.UPDATE_GITHUB_APP_PRIVATE_KEY }}
          owner: turambarr
          repositories: commddl
          permission-contents: write
          permission-pull-requests: write
      - name: Create or update candidate PR
        uses: peter-evans/create-pull-request@v8
        id: cpr
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: main
          branch: codex/official-updates-${{ github.event.client_payload.batchId }}-v${{ github.event.client_payload.version }}
          delete-branch: true
          commit-message: 'data: 应用已审阅的官网更新'
          title: '审阅 CommDDL 官网更新：${{ github.event.client_payload.batchId }}'
          body: |
            本 PR 根据 CommDDL 管理后台保存的审阅决定更新正式数据。

            批次： `${{ github.event.client_payload.batchId }}`
            版本：`${{ github.event.client_payload.version }}`

            管理员在后台核对本 PR 的最终文件和 SHA 后，只需点击一次“批准并发布这些更新”。后台会以该登录管理员身份提交绑定此 SHA 的 GitHub review，再调用标准合并 API；仓库必需检查和审批保护仍然生效。

            此自动数据 PR 只允许修改已审阅实体对应的既有 `data/venues/**/*.yml` 或 `data/calls/**/*.yml` 文件；代码、配置、工作流和目录身份变更应另行提交开发 PR。
          add-paths: |
            data/venues/**/*.yml
            data/calls/**/*.yml
      - name: Record final PR revision and notify reviewers
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          UPDATE_ADMIN_API_URL: ${{ vars.UPDATE_ADMIN_API_URL }}
          UPDATE_INTERNAL_HMAC_SECRET: ${{ secrets.UPDATE_INTERNAL_HMAC_SECRET }}
          BATCH_ID: ${{ github.event.client_payload.batchId }}
          BATCH_VERSION: ${{ github.event.client_payload.version }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          FINAL_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: node scripts/updates/service-client.cjs record-pr --id "$BATCH_ID" --version "$BATCH_VERSION" --pr-number "$PR_NUMBER" --pr-url "$PR_URL" --final-sha "$FINAL_SHA"
      - name: Bind a required check to the notified final PR SHA
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_NAME: commddl
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          FINAL_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: node scripts/updates/report-final-notice-check.cjs
      - name: Release and reset a batch when PR generation failed
        if: failure() && steps.cpr.outputs.pull-request-number == ''
        env:
          UPDATE_ADMIN_API_URL: ${{ vars.UPDATE_ADMIN_API_URL }}
          UPDATE_INTERNAL_HMAC_SECRET: ${{ secrets.UPDATE_INTERNAL_HMAC_SECRET }}
          BATCH_ID: ${{ github.event.client_payload.batchId }}
        run: node scripts/updates/service-client.cjs fail-batch --id "$BATCH_ID" --reason "update-pr-workflow-failed"
