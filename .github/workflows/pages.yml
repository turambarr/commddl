name: Validate and deploy CommDDL
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install the service client dependency
        run: npm ci
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record the verified deployed commit
        if: success() && vars.COMMDDL_RECONCILIATION_ENABLED == 'true'
        env:
          UPDATE_ADMIN_API_URL: ${{ vars.UPDATE_ADMIN_API_URL }}
          UPDATE_INTERNAL_HMAC_SECRET: ${{ secrets.UPDATE_INTERNAL_HMAC_SECRET }}
        run: node scripts/updates/service-client.cjs mark-deployed --sha "${GITHUB_SHA}"
      - name: Record a retryable failed deployment
        if: always() && vars.COMMDDL_RECONCILIATION_ENABLED == 'true' && steps.deployment.outcome == 'failure'
        env:
          UPDATE_ADMIN_API_URL: ${{ vars.UPDATE_ADMIN_API_URL }}
          UPDATE_INTERNAL_HMAC_SECRET: ${{ secrets.UPDATE_INTERNAL_HMAC_SECRET }}
        run: node scripts/updates/service-client.cjs mark-deployed --sha "${GITHUB_SHA}" --result failed
