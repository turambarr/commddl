name: CommDDL final notice
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
permissions:
  contents: read
  checks: write
concurrency:
  group: final-notice-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true
jobs:
  classify:
    if: vars.COMMDDL_FINAL_NOTICE_CHECK_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      # Use trusted base-branch code only; this job reads PR metadata and file names,
      # and never checks out or executes code from the pull request.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mark ordinary non-data PRs neutral
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_NAME: commddl
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FINAL_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CHECK_MODE: neutral-if-non-data
          UPDATE_ADMIN_API_URL: ${{ vars.UPDATE_ADMIN_API_URL }}
          UPDATE_INTERNAL_HMAC_SECRET: ${{ secrets.UPDATE_INTERNAL_HMAC_SECRET }}
        run: node scripts/updates/report-final-notice-check.cjs
