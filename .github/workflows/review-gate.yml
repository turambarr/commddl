name: CommDDL review gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  gate:
    name: catalog, tests, and generated site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
