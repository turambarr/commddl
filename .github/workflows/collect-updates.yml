name: Copilot structured official updates
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Optional comma-separated venue/call IDs'
        required: false
        type: string
      dry_run:
        description: 'Collect and upload a preview without saving candidates or sending email'
        required: true
        default: true
        type: boolean
      retry_failed:
        description: 'Retry failures from scan_run_id; without it, use the legacy failed-source queue'
        required: true
        default: false
        type: boolean
      run_copilot:
        description: 'Invoke Copilot to produce evidence-bound structured candidates'
        required: true
        default: false
        type: boolean
      retry_batch_id:
        description: 'Reprocess a saved, unreviewed candidate without recollecting sources'
        required: false
        type: string
      scan_run_id:
        description: 'Resume the next page of an existing frozen watchlist round'
        required: false
        type: string
      send_notifications:
        description: 'Send email reminders after candidate storage (leave off during rollout)'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: commddl-collector
  cancel-in-progress: false
jobs:
  collect:
    # Missing repository variables evaluate as empty/false. Scheduled runs are
    # opt-in; workflow_dispatch remains available for a controlled dry-run.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (vars.UPDATE_AUTOMATION_ENABLED == 'true' && vars.COPILOT_COLLECTION_ENABLED == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate saved-candidate retry
        id: validate-retry
        if: github.event_name == 'workflow_dispatch' && inputs.retry_batch_id != ''
        env:
          UPDATE_ADMIN_API_URL: ${{ vars.UPDATE_ADMIN_API_URL }}
          UPDATE_INTERNAL_HMAC_SECRET: ${{ secrets.UPDATE_INTERNAL_HMAC_SECRET }}
          RETRY_BATCH_ID: ${{ inputs.retry_batch_id }}
          RUN_COPILOT: ${{ inputs.run_copilot }}
          DRY_RUN: ${{ inputs.dry_run }}
          SELECTED_IDS: ${{ inputs.ids }}
        run: |
          test "$RUN_COPILOT" = true && test "$DRY_RUN" = false && test -z "$SELECTED_IDS" || { echo 'Saved-candidate retry requires run_copilot=true, dry_run=false, and no ids input.' >&2; exit 1; }
          node scripts/updates/service-client.cjs export-batch --id "$RETRY_BATCH_ID" --directory /tmp/commddl-retry
          node -e "const m=require('/tmp/commddl-retry/metadata.json'),d=require('/tmp/commddl-retry/decisions.json'),p=require('/tmp/commddl-retry/candidate.json');if(!['awaiting-review','notice-incomplete'].includes(m.status)||m.prNumber||m.finalSha||Object.keys(d||{}).length||!p.items?.length)throw Error('Batch has a decision, PR, final SHA, or is no longer awaiting review');p.id=m.id;p.run={mode:'reuse-evidence',requestedIds:p.items.map(i=>i.entity.id),coverageScope:'已保存批次中的官网证据；本次仅重新整理，未重新抓取',counts:{requested:p.items.length,checked:0,changed:0,noChange:0,failed:0,partial:0,notChecked:0,reusedEvidence:p.items.length}};require('fs').writeFileSync('/tmp/commddl-candidates.json',JSON.stringify(p,null,2)+'\\n');require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'version='+m.version+'\\ncount='+p.items.length+'\\n')"
      - name: Sync catalog registry
        if: inputs.retry_batch_id == '' && (github.event_name == 'schedule' || (inputs.ids == '' && inputs.retry_failed != true))
        env:
          UPDATE_ADMIN_API_URL: ${{ vars.UPDATE_ADMIN_API_URL }}
          UPDATE_INTERNAL_HMAC_SECRET: ${{ secrets.UPDATE_INTERNAL_HMAC_SECRET }}
        run: node scripts/updates/service-client.cjs register-sources
      - name: Freeze enabled watchlist for this round
        id: start-scan
        if: inputs.retry_batch_id == '' && inputs.ids == '' && inputs.retry_failed != true && inputs.scan_run_id == ''
        env:
          UPDATE_ADMIN_API_URL: ${{ vars.UPDATE_ADMIN_API_URL }}
          UPDATE_INTERNAL_HMAC_SECRET: ${{ secrets.UPDATE_INTERNAL_HMAC_SECRET }}
        run: node scripts/updates/service-client.cjs start-scan-run
      - name: Select next frozen watchlist page
        id: scan-page
        if: inputs.retry_batch_id == '' && inputs.ids == '' && (inputs.scan_run_id != '' || (inputs.retry_failed != true && steps.start-scan.outcome == 'success'))
        env:
          UPDATE_ADMIN_API_URL: ${{ vars.UPDATE_ADMIN_API_URL }}
          UPDATE_INTERNAL_HMAC_SECRET: ${{ secrets.UPDATE_INTERNAL_HMAC_SECRET }}
          SCAN_RUN_ID: ${{ steps.start-scan.outputs.scan_run_id || inputs.scan_run_id }}
          RETRY_FAILED: ${{ inputs.retry_failed }}
        run: |
          if [ "$RETRY_FAILED" = "true" ] && [ -n "$SCAN_RUN_ID" ]; then RETRY_ARG=--retry-failed; else RETRY_ARG=; fi
          node scripts/updates/service-client.cjs get-scan-run-page --id "$SCAN_RUN_ID" --output /tmp/commddl-due.json --limit 20 $RETRY_ARG
      - name: Select legacy due sources
        id: due
        if: inputs.retry_batch_id == '' && inputs.scan_run_id == '' && steps.start-scan.outcome != 'success' && inputs.ids == '' && inputs.retry_failed != true && github.event_name == 'workflow_dispatch'
        env:
          UPDATE_ADMIN_API_URL: ${{ vars.UPDATE_ADMIN_API_URL }}
          UPDATE_INTERNAL_HMAC_SECRET: ${{ secrets.UPDATE_INTERNAL_HMAC_SECRET }}
        run: node scripts/updates/service-client.cjs get-due --output /tmp/commddl-due.json
      - name: Select failed sources for retry
        if: inputs.retry_batch_id == '' && inputs.scan_run_id == '' && github.event_name == 'workflow_dispatch' && inputs.ids == '' && inputs.retry_failed == true
        env:
          UPDATE_ADMIN_API_URL: ${{ vars.UPDATE_ADMIN_API_URL }}
          UPDATE_INTERNAL_HMAC_SECRET: ${{ secrets.UPDATE_INTERNAL_HMAC_SECRET }}
        run: node scripts/updates/service-client.cjs get-failed --output /tmp/commddl-due.json
      - name: Read explicit source baselines
        if: inputs.retry_batch_id == '' && github.event_name == 'workflow_dispatch' && inputs.ids != ''
        env:
          UPDATE_ADMIN_API_URL: ${{ vars.UPDATE_ADMIN_API_URL }}
          UPDATE_INTERNAL_HMAC_SECRET: ${{ secrets.UPDATE_INTERNAL_HMAC_SECRET }}
          SELECTED_IDS: ${{ inputs.ids }}
        run: node scripts/updates/service-client.cjs get-baselines --ids "$SELECTED_IDS" --output /tmp/commddl-due.json
      - name: Collect due sources
        id: collect-due
        if: inputs.retry_batch_id == '' && inputs.scan_run_id == '' && steps.start-scan.outcome != 'success' && github.event_name == 'workflow_dispatch' && inputs.ids == '' && inputs.retry_failed != true
        run: node scripts/updates/collector.cjs --due --baselines /tmp/commddl-due.json --out /tmp/commddl-candidates.json
      - name: Collect next frozen watchlist page
        id: collect-scan
        if: inputs.retry_batch_id == '' && inputs.ids == '' && steps.scan-page.outputs.scan_count != '0'
        env:
          SELECTED_IDS: ${{ steps.scan-page.outputs.scan_ids }}
          SCAN_RUN_ID: ${{ steps.start-scan.outputs.scan_run_id || inputs.scan_run_id }}
        run: node scripts/updates/collector.cjs --ids "$SELECTED_IDS" --baselines /tmp/commddl-due.json --watch-entries /tmp/commddl-due.json --scan-run "$SCAN_RUN_ID" --out /tmp/commddl-candidates.json
      - name: Collect selected sources
        id: collect-selected
        if: inputs.retry_batch_id == '' && github.event_name == 'workflow_dispatch' && inputs.ids != ''
        env:
          SELECTED_IDS: ${{ inputs.ids }}
        run: node scripts/updates/collector.cjs --ids "$SELECTED_IDS" --baselines /tmp/commddl-due.json --out /tmp/commddl-candidates.json
      - name: Initialize final candidate file
        id: candidate-count
        if: inputs.retry_batch_id == ''
        run: |
          test -s /tmp/commddl-candidates.json || printf '{"items":[],"run":{"counts":{"checked":0,"changed":0,"noChange":0,"failed":0,"notChecked":0}}}\n' > /tmp/commddl-candidates.json
          cp /tmp/commddl-candidates.json /tmp/commddl-final-candidates.json
          node -e "const x=require('/tmp/commddl-candidates.json'),items=x.items||[];console.log('count='+items.filter(i=>i.changes?.length||i.sourceChanges?.length).length);console.log('scanned='+items.length)" >> "$GITHUB_OUTPUT"
      - name: Record this page in the frozen run
        id: record-scan
        if: inputs.retry_batch_id == '' && (inputs.scan_run_id != '' || steps.start-scan.outcome == 'success') && steps.scan-page.outputs.scan_count != '0'
        env:
          UPDATE_ADMIN_API_URL: ${{ vars.UPDATE_ADMIN_API_URL }}
          UPDATE_INTERNAL_HMAC_SECRET: ${{ secrets.UPDATE_INTERNAL_HMAC_SECRET }}
          SCAN_RUN_ID: ${{ steps.start-scan.outputs.scan_run_id || inputs.scan_run_id }}
        run: node scripts/updates/service-client.cjs record-scan-results --id "$SCAN_RUN_ID" --file /tmp/commddl-candidates.json
      - name: Install GitHub Copilot CLI
        if: (steps.candidate-count.outputs.count != '0' || steps.validate-retry.outcome == 'success') && (github.event_name == 'schedule' || inputs.run_copilot == true)
        env:
          COPILOT_CLI_VERSION: '1.0.101'
        run: |
          npm install --global "@github/copilot@$COPILOT_CLI_VERSION"
          copilot --version
      - name: Prepare Copilot plain-text input
        if: (steps.candidate-count.outputs.count != '0' || steps.validate-retry.outcome == 'success') && (github.event_name == 'schedule' || inputs.run_copilot == true)
        run: node scripts/updates/prepare-copilot-input.cjs --prompt scripts/updates/copilot-structure-prompt.md --source /tmp/commddl-candidates.json --changes-only --out /tmp/commddl-copilot-input.txt
      - name: Structure official source evidence with Copilot
        id: copilot
        if: (steps.candidate-count.outputs.count != '0' || steps.validate-retry.outcome == 'success') && (github.event_name == 'schedule' || inputs.run_copilot == true)
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          test -n "$COPILOT_GITHUB_TOKEN" || { echo 'COPILOT_GITHUB_TOKEN is not configured.' >&2; exit 1; }
          rm -f .commddl-copilot-output.json
          timeout 180s copilot --no-ask-user --allow-tool='write(.commddl-copilot-output.json)' -s < /tmp/commddl-copilot-input.txt
          test -s .commddl-copilot-output.json
      - name: Validate Copilot evidence and merge structured candidates
        id: merge-copilot
        if: (steps.candidate-count.outputs.count != '0' || steps.validate-retry.outcome == 'success') && (github.event_name == 'schedule' || inputs.run_copilot == true)
        run: node scripts/updates/merge-copilot-structure.cjs --source /tmp/commddl-candidates.json --copilot .commddl-copilot-output.json --out /tmp/commddl-final-candidates.json
      - name: Save candidate batch for admin review
        id: save-batch
        if: inputs.retry_batch_id == '' && (github.event_name == 'schedule' || (inputs.run_copilot == true && inputs.dry_run == false)) && steps.copilot.outcome == 'success' && steps.merge-copilot.outcome == 'success'
        env:
          UPDATE_ADMIN_API_URL: ${{ vars.UPDATE_ADMIN_API_URL }}
          UPDATE_INTERNAL_HMAC_SECRET: ${{ secrets.UPDATE_INTERNAL_HMAC_SECRET }}
        run: |
          if [ "${{ inputs.send_notifications }}" = "true" ]; then node scripts/updates/service-client.cjs submit --file /tmp/commddl-final-candidates.json; else node scripts/updates/service-client.cjs submit --file /tmp/commddl-final-candidates.json --no-notify; fi
      - name: Save structured retry version
        id: save-retry
        if: inputs.retry_batch_id != '' && steps.copilot.outcome == 'success' && steps.merge-copilot.outcome == 'success'
        env:
          UPDATE_ADMIN_API_URL: ${{ vars.UPDATE_ADMIN_API_URL }}
          UPDATE_INTERNAL_HMAC_SECRET: ${{ secrets.UPDATE_INTERNAL_HMAC_SECRET }}
          RETRY_BATCH_ID: ${{ inputs.retry_batch_id }}
          EXPECTED_VERSION: ${{ steps.validate-retry.outputs.version }}
        run: node scripts/updates/service-client.cjs restructure-batch --id "$RETRY_BATCH_ID" --expected-version "$EXPECTED_VERSION" --file /tmp/commddl-final-candidates.json --no-notify
      - name: Preserve candidates when Copilot fails
        id: fallback-save
        if: always() && inputs.retry_batch_id == '' && steps.candidate-count.outputs.count != '0' && (steps.copilot.outcome == 'failure' || steps.merge-copilot.outcome == 'failure') && (github.event_name == 'schedule' || (inputs.run_copilot == true && inputs.dry_run == false))
        env:
          UPDATE_ADMIN_API_URL: ${{ vars.UPDATE_ADMIN_API_URL }}
          UPDATE_INTERNAL_HMAC_SECRET: ${{ secrets.UPDATE_INTERNAL_HMAC_SECRET }}
        run: |
          node scripts/updates/mark-copilot-failure.cjs --source /tmp/commddl-candidates.json --out /tmp/commddl-final-candidates.json
          node scripts/updates/service-client.cjs submit --file /tmp/commddl-final-candidates.json --no-notify
          exit 1
      - name: Summarize collection and review readiness
        if: always()
        env:
          COPILOT_RESULT: ${{ steps.copilot.outcome || 'skipped' }}
          VALIDATION_RESULT: ${{ steps.merge-copilot.outcome || 'skipped' }}
          SAVE_RESULT: ${{ steps.save-batch.outcome || steps.save-retry.outcome || steps.fallback-save.outcome || 'skipped' }}
          BATCH_ID: ${{ steps.save-batch.outputs.batch_id || steps.save-retry.outputs.batch_id || steps.fallback-save.outputs.batch_id }}
          BATCH_VERSION: ${{ steps.save-batch.outputs.batch_version || steps.save-retry.outputs.batch_version || steps.fallback-save.outputs.batch_version }}
          NOTIFICATION_RESULT: ${{ steps.save-batch.outputs.notification_status || steps.save-retry.outputs.notification_status || steps.fallback-save.outputs.notification_status || 'not-attempted' }}
          RETRY_BATCH_ID: ${{ inputs.retry_batch_id }}
          COLLECT_DUE_RESULT: ${{ steps.collect-due.outcome || 'skipped' }}
          COLLECT_SELECTED_RESULT: ${{ steps.collect-selected.outcome || 'skipped' }}
          RETRY_RESULT: ${{ steps.validate-retry.outcome || 'skipped' }}
          SCAN_RUN_ID: ${{ steps.start-scan.outputs.scan_run_id || inputs.scan_run_id }}
          SCAN_RESULT: ${{ steps.collect-scan.outcome || 'skipped' }}
          SCAN_STATUS: ${{ steps.record-scan.outputs.scan_status || 'not-recorded' }}
          SCAN_CHANGED: ${{ steps.record-scan.outputs.scan_changed || '0' }}
          SCAN_DISCOVERED: ${{ steps.record-scan.outputs.scan_discovered || '0' }}
          SCAN_NO_CHANGE: ${{ steps.record-scan.outputs.scan_no_change || '0' }}
          SCAN_FAILED: ${{ steps.record-scan.outputs.scan_failed || '0' }}
          SCAN_PARTIAL: ${{ steps.record-scan.outputs.scan_partial || '0' }}
          SCAN_NOT_CHECKED: ${{ steps.record-scan.outputs.scan_not_checked || '0' }}
        run: |
          if [ -n "$RETRY_BATCH_ID" ]; then COLLECTION_RESULT="复用已保存批次 $RETRY_BATCH_ID（$RETRY_RESULT）"; else COLLECTION_RESULT="采集：due=$COLLECT_DUE_RESULT，指定来源=$COLLECT_SELECTED_RESULT"; fi
          {
            echo '### CommDDL 官方来源处理结果'
            echo "- $COLLECTION_RESULT"
            echo "- Copilot 结构化：$COPILOT_RESULT"
            echo "- 证据校验：$VALIDATION_RESULT"
            echo "- 候选保存步骤：$SAVE_RESULT"
            echo "- 关注清单轮次：${SCAN_RUN_ID:-未使用}；本页采集：$SCAN_RESULT；状态=$SCAN_STATUS，有变化=$SCAN_CHANGED，新发现=$SCAN_DISCOVERED，无变化=$SCAN_NO_CHANGE，失败=$SCAN_FAILED，部分=$SCAN_PARTIAL，未检查=$SCAN_NOT_CHECKED。每页最多 20 个对象，未完成时可用同一轮次 ID 续跑。"
            echo "- 批次：${BATCH_ID:-未新建} ${BATCH_VERSION:+v$BATCH_VERSION}"
            echo "- 邮件提醒：$NOTIFICATION_RESULT（失败不撤销候选，可在后台重试）"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commddl-collection-${{ github.run_id }}
          path: |
            /tmp/commddl-candidates.json
            /tmp/commddl-final-candidates.json
            /tmp/commddl-due.json
            .commddl-copilot-output.json
          if-no-files-found: ignore
          retention-days: 14
