<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CommDDL 管理员审阅</title><style>
:root{font:15px/1.65 system-ui,-apple-system,"PingFang SC",sans-serif;color:#203d3b;background:#f1f6f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:0 auto;padding:32px 20px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:24px;margin:0}h2{font-size:18px;margin:28px 0 12px}.muted{color:#6d8480}button,input{font:inherit}button{border:1px solid #c9dad3;background:#fff;border-radius:7px;padding:8px 12px;color:#204d45;cursor:pointer}button.primary{background:#17665b;color:#fff;border-color:#17665b}.panel,.card{background:white;border:1px solid #dce7e2;border-radius:12px;padding:18px;margin:14px 0}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.row input[type=email]{min-width:240px;flex:1;padding:9px;border:1px solid #c9dad3;border-radius:7px}.status{font-size:12px;color:#607b75}.recipient,.batch-item{border-top:1px solid #e7eeeb;padding:12px 0}.badge{border-radius:20px;padding:2px 9px;background:#edf4f0;font-size:12px}.error{color:#a33525}.success{color:#23764d}.section{border-top:1px solid #e7eeeb;padding:14px 0}.section h3{font-size:15px;margin:0 0 5px}.block{padding:9px 12px;background:#f7faf8;border-radius:6px;margin:6px 0;white-space:pre-wrap}.danger{color:#963526}.hidden{display:none!important}pre{white-space:pre-wrap;overflow-wrap:anywhere}.decision{margin:7px 5px 5px 0}.correction{width:100%;min-height:88px;padding:9px;border:1px solid #c9dad3;border-radius:7px;font:inherit}.top-actions{display:flex;gap:8px}.banner{padding:12px 14px;border-radius:8px;background:#fff6df;color:#765518;margin:14px 0}.small{font-size:12px}@media(max-width:600px){.wrap{padding:22px 14px}.panel,.card{padding:14px}header{align-items:flex-start;flex-direction:column}}
</style></head>
<body><main class="wrap"><header><div><p class="muted">COMMDDL · 维护工作台</p><h1>更新审阅与管理员通知</h1></div><div class="top-actions"><button id="login" class="primary">使用 GitHub 账号登录</button><button id="logout" class="hidden">退出登录</button></div></header><div id="message" role="status" class="banner hidden"></div><section id="signed-out" class="panel"><p>请使用仓库所有者或所有者授权且具备目标仓库写入权限的维护者账号登录。邮箱只用于接收更新提醒，不授予仓库权限。</p></section><div id="app" class="hidden"><p id="status" class="muted"></p><section class="panel"><h2>维护者收件邮箱</h2><form id="add-email" class="row"><input type="email" name="email" placeholder="name@example.com" required><button class="primary">添加并发送验证邮件</button></form><p class="small muted">邮件服务未配置时，地址会保持待验证；配置好后可重新发送验证邮件。</p><div id="recipients"></div></section><section><h2>待审更新批次</h2><div id="batches"></div></section></div></main><script>
const $=s=>document.querySelector(s),msg=(text,error=false)=>{const el=$('#message');el.textContent=text;el.classList.remove('hidden','error','success');el.classList.add(error?'error':'success')};
async function api(path,options={}){const response=await fetch(path,{credentials:'same-origin',...options,headers:{'content-type':'application/json',...(options.headers||{})}}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||data.error||`请求失败（${response.status}）`);return data;}
function statusLabel(status){return ({pending:'待验证',enabled:'已启用',disabled:'已停用',failed:'发送失败'})[status]||status}
async function loadRecipients(){const {recipients}=await api('/api/recipients');$('#recipients').innerHTML=recipients.map(r=>`<div class="recipient row"><strong>${escapeHTML(r.email)}</strong><span class="badge">${statusLabel(r.status)}</span><span class="status">${r.last_error?escapeHTML(r.last_error):''}</span>${r.status==='pending'?`<button data-recipient="${r.id}" data-action="resend">重发验证</button>`:''}${r.status==='enabled'?`<button data-recipient="${r.id}" data-action="test">发送测试邮件</button><button data-recipient="${r.id}" data-action="disable">停用</button>`:''}${r.status==='disabled'?`<button data-recipient="${r.id}" data-action="enable">启用</button>`:''}<button class="danger" data-recipient="${r.id}" data-action="delete">删除</button></div>`).join('')||'<p class="muted">尚未添加收件邮箱。</p>';}
function escapeHTML(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderSection(section){const renderList=items=>`<ul>${(items||[]).map(item=>`<li>${escapeHTML(item.text)}${item.items?.length?renderList(item.items):''}</li>`).join('')}</ul>`;return `<div class="section"><h3>${escapeHTML(section.heading)} <span class="badge">${escapeHTML(section.sourceUrl||'')}</span></h3>${(section.blocks||[]).map(block=>block.type==='paragraph'?`<div class="block">${escapeHTML(block.text)}</div>`:block.type==='list'?renderList(block.items):block.type==='table'?`<pre>${escapeHTML(block.rows.map(row=>row.join(' | ')).join('\n'))}</pre>`:block.type==='links'?`<p>${(block.items||[]).filter(item=>String(item.href||'').startsWith('https://')).map(item=>`<a href="${escapeHTML(item.href)}" target="_blank" rel="noreferrer">${escapeHTML(item.label)}</a>`).join(' · ')}</p>`:'').join('')}</div>`;}
function primaryParagraph(section){return section?.blocks?.find(block=>block.type==='paragraph')?.text||'';}
async function loadBatches(){const {batches}=await api('/api/batches');$('#batches').innerHTML=batches.length?batches.map(b=>`<article class="card"><div class="row"><strong>${escapeHTML(b.id)}</strong><span class="badge">${escapeHTML(b.status)}</span><span class="status">v${b.version} · ${escapeHTML(b.notification_status)}</span></div><p>${escapeHTML(b.created_at)}${b.pr_url?` · <a href="${escapeHTML(b.pr_url)}" target="_blank" rel="noreferrer">查看最终 PR</a>`:''}</p>${b.notification_status!=='complete'?`<button data-notify="${escapeHTML(b.id)}">重试审阅邮件</button>`:''}<button data-batch="${escapeHTML(b.id)}">查看来源与差异</button><div id="batch-${escapeHTML(b.id)}"></div></article>`).join(''):'<p class="muted">目前没有待审更新。</p>';}
async function showBatch(id){const batch=await api(`/api/batches/${encodeURIComponent(id)}`),{payload,decisions}=batch,reviewable=(payload.items||[]).some(item=>(item.changes||[]).length),container=$(`#batch-${CSS.escape(id)}`),rows=[];for(const item of payload.items||[]){const itemDecisions=decisions[item.entity.id]||{};rows.push(`<div class="section"><h3>${escapeHTML(item.entity.id)} · ${escapeHTML(item.entity.kind)}</h3>${(item.failures||[]).map(f=>`<p class="error">${escapeHTML(f.url)}：${escapeHTML(f.message)}</p>`).join('')}${(item.changes||[]).map(change=>`<div class="card" data-section="${escapeHTML(JSON.stringify(change.next||{}))}" data-id="${escapeHTML(change.sectionId)}" data-entity="${escapeHTML(item.entity.id)}"><strong>${escapeHTML(change.type)} · ${escapeHTML(change.heading||change.next?.heading||change.old?.heading||change.sectionId)}</strong><p class="small">来源：${escapeHTML(change.sourceUrl||change.next?.sourceUrl||change.old?.sourceUrl||'')}</p>${change.conflict?'<p class="error">发现与已发布内容的冲突，请谨慎核对。</p>':''}${change.type==='node-date-changed'?`<p>截止日期：${escapeHTML(change.oldDate||'未设置')} → ${escapeHTML(change.nextDate)}</p><label class="small muted">修正日期<input class="date-correction" type="date" value="${escapeHTML(itemDecisions[change.sectionId]?.date||change.nextDate)}"></label>`:change.old?renderSection(change.old):''}${change.type!=='node-date-changed'&&change.next?renderSection(change.next)+`<label class="small muted">修正首段文字（保留其余官网结构）<textarea class="correction">${escapeHTML(primaryParagraph(itemDecisions[change.sectionId]?.section||change.next))}</textarea></label>`:''}<button class="decision" data-decision="accept">接受</button>${change.next||change.type==='node-date-changed'?`<button class="decision" data-decision="edit">采用修正</button>`:''}<button class="decision" data-decision="reject">拒绝</button><span class="badge">当前：${escapeHTML(itemDecisions[change.sectionId]?.action||'待处理')}</span></div>`).join('')}${(item.gaps||[]).map(g=>`<p class="banner">采集缺口：${escapeHTML(g)}</p>`).join('')}</div>`);}
container.innerHTML=rows.join('')+(batch.pr_url?`<p class="banner">最终 SHA：<code>${escapeHTML(batch.final_sha||'')}</code> · 通知：${escapeHTML(batch.notification_status)}</p>${batch.status==='awaiting-review'&&batch.notification_status==='complete'?`<button class="primary" data-approve="${escapeHTML(id)}" data-sha="${escapeHTML(batch.final_sha||'')}">批准此最终版本并发布</button>`:''}`:reviewable&&batch.status==='awaiting-review'&&batch.notification_status==='complete'?`<p class="banner">保存取舍后，系统将生成并检查正式 YAML PR。</p><button class="primary" data-save="${escapeHTML(id)}">保存本页取舍</button>`:`<p class="banner">${reviewable?'当前批次状态：'+escapeHTML(batch.status):'没有可审阅的变更；失败来源可重试采集。'} · 通知：${escapeHTML(batch.notification_status)}</p>`); }
async function refresh(){try{const s=await api('/api/session');$('#signed-out').classList.add('hidden');$('#app').classList.remove('hidden');$('#login').classList.add('hidden');$('#logout').classList.remove('hidden');$('#status').textContent=`GitHub 管理员：${s.login} · 项目：${s.project} · 启用收件人：${s.enabledRecipients} · 邮件服务：${s.mailReady?'已配置':'待配置'} · 最近成功采集：${s.lastSuccessfulRun||'尚无记录'}`;await Promise.all([loadRecipients(),loadBatches()]);}catch{$('#signed-out').classList.remove('hidden');$('#app').classList.add('hidden');$('#login').classList.remove('hidden');$('#logout').classList.add('hidden');}}
$('#login').onclick=()=>location.href='/auth/github';$('#logout').onclick=async()=>{await api('/auth/logout',{method:'POST',body:'{}'});location.reload()};
$('#add-email').onsubmit=async event=>{event.preventDefault();try{const email=new FormData(event.currentTarget).get('email');const result=await api('/api/recipients',{method:'POST',body:JSON.stringify({email})});msg(result.verificationSent?'验证邮件已发送。':'邮箱已保存为待验证；邮件服务尚未成功发送。',!result.verificationSent);event.currentTarget.reset();await loadRecipients()}catch(error){msg(error.message,true)}};
document.addEventListener('click',async event=>{const b=event.target.closest('button');if(!b)return;try{if(b.dataset.recipient){const id=b.dataset.recipient,action=b.dataset.action;if(action==='resend'){const r=await api(`/api/recipients/${id}/resend-verification`,{method:'POST',body:'{}'});msg(r.verificationSent?'验证邮件已发送。':r.mailError,true)}else if(action==='test'){const r=await api(`/api/recipients/${id}/test`,{method:'POST',body:'{}'});msg(r.sent?'测试邮件已发送。':r.error,true)}else if(action==='delete'){await api(`/api/recipients/${id}`,{method:'DELETE'});msg('邮箱已删除。')}else{await api(`/api/recipients/${id}`,{method:'PATCH',body:JSON.stringify({status:action==='enable'?'enabled':'disabled'})});msg('邮箱状态已更新。')}await loadRecipients()}if(b.dataset.notify){const r=await api(`/api/batches/${encodeURIComponent(b.dataset.notify)}/notify`,{method:'POST',body:'{}'});msg(r.complete?'本批邮件通知已完整发送。':'邮件仍未完整送达。',!r.complete);await loadBatches()}if(b.dataset.approve){const r=await api(`/api/batches/${encodeURIComponent(b.dataset.approve)}/approve-publish`,{method:'POST',body:JSON.stringify({finalSha:b.dataset.sha})});msg(r.message);await loadBatches()}if(b.dataset.batch)await showBatch(b.dataset.batch);if(b.dataset.decision){const c=b.closest('.card');c.dataset.action=b.dataset.decision;c.querySelector('.badge').textContent=({accept:'接受',edit:'采用修正',reject:'拒绝'})[b.dataset.decision];}if(b.dataset.save){const card=$(`#batch-${CSS.escape(b.dataset.save)}`),decisions={};for(const row of card.querySelectorAll('.card[data-id][data-section]')){const action=row.dataset.action;if(!action)continue;const entity=row.dataset.entity,entityDecisions=decisions[entity]||(decisions[entity]={});if(action==='edit'){const date=row.querySelector('.date-correction');if(date){entityDecisions[row.dataset.id]={action:'edit',date:date.value};continue;}const section=JSON.parse(row.dataset.section||'{}'),text=row.querySelector('.correction')?.value||'',block=section.blocks?.find(x=>x.type==='paragraph');if(block)block.text=text;else if(text)section.blocks=[...(section.blocks||[]),{type:'paragraph',text}];entityDecisions[row.dataset.id]={action:'edit',section}}else entityDecisions[row.dataset.id]={action};}const result=await api(`/api/batches/${encodeURIComponent(b.dataset.save)}/decisions`,{method:'PUT',body:JSON.stringify({decisions})});msg(`已保存 v${result.version} 取舍。${result.message}`);await loadBatches()}}catch(error){msg(error.message,true)}});
const verification=location.hash.match(/verify=([^&]+)/);if(verification){api('/api/verify',{method:'POST',body:JSON.stringify({token:decodeURIComponent(verification[1])})}).then(()=>msg('邮箱验证成功。')).catch(error=>msg(error.message,true)).finally(()=>{history.replaceState(null,'',location.pathname);refresh()})}else refresh();
</script></body></html>
