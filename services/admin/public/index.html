<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CommDDL 管理员审阅</title><style>
:root{font:15px/1.65 system-ui,-apple-system,"PingFang SC",sans-serif;color:#203d3b;background:#f1f6f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:0 auto;padding:32px 20px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:24px;margin:0}h2{font-size:18px;margin:28px 0 12px}.muted{color:#6d8480}button,input{font:inherit}button{border:1px solid #c9dad3;background:#fff;border-radius:7px;padding:8px 12px;color:#204d45;cursor:pointer}button.primary{background:#17665b;color:#fff;border-color:#17665b}.panel,.card{background:white;border:1px solid #dce7e2;border-radius:12px;padding:18px;margin:14px 0}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.row input[type=email]{min-width:240px;flex:1;padding:9px;border:1px solid #c9dad3;border-radius:7px}.status{font-size:12px;color:#607b75}.recipient,.batch-item{border-top:1px solid #e7eeeb;padding:12px 0}.badge{border-radius:20px;padding:2px 9px;background:#edf4f0;font-size:12px}.error{color:#a33525}.success{color:#23764d}.section{border-top:1px solid #e7eeeb;padding:14px 0}.section h3{font-size:15px;margin:0 0 5px}.block{padding:9px 12px;background:#f7faf8;border-radius:6px;margin:6px 0;white-space:pre-wrap}.danger{color:#963526}.hidden{display:none!important}pre{white-space:pre-wrap;overflow-wrap:anywhere}.decision{margin:7px 5px 5px 0}.correction{width:100%;min-height:88px;padding:9px;border:1px solid #c9dad3;border-radius:7px;font:inherit}.top-actions{display:flex;gap:8px}.banner{padding:12px 14px;border-radius:8px;background:#fff6df;color:#765518;margin:14px 0}.small{font-size:12px}@media(max-width:600px){.wrap{padding:22px 14px}.panel,.card{padding:14px}header{align-items:flex-start;flex-direction:column}}
</style></head>
<body><main class="wrap"><header><div><p class="muted">COMMDDL · 维护工作台</p><h1>更新审阅与管理员通知</h1></div><div class="top-actions"><button id="login" class="primary">使用 GitHub 账号登录</button><button id="logout" class="hidden">退出登录</button></div></header><div id="message" role="status" class="banner hidden"></div><section id="signed-out" class="panel"><p>请使用仓库所有者或所有者授权且具备目标仓库写入权限的维护者账号登录。邮箱只用于接收更新提醒，不授予仓库权限。</p></section><div id="app" class="hidden"><p id="status" class="muted"></p><section class="panel"><h2>维护者收件邮箱</h2><form id="add-email" class="row"><input type="email" name="email" placeholder="name@example.com" required><button class="primary">添加并发送验证邮件</button></form><p class="small muted">邮件只用于提醒待审内容；发信未配置时，候选仍会进入后台供管理员审阅。</p><div id="recipients"></div></section><section><h2>待审更新批次</h2><div id="batches"></div></section></div></main><script>
const $=s=>document.querySelector(s),msg=(text,error=false)=>{const el=$('#message');el.textContent=text;el.classList.remove('hidden','error','success');el.classList.add(error?'error':'success')};
async function api(path,options={}){const response=await fetch(path,{credentials:'same-origin',...options,headers:{'content-type':'application/json',...(options.headers||{})}}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||data.error||`请求失败（${response.status}）`);return data;}
const labels={status:{pending:'待处理',enabled:'已启用',disabled:'已停用',failed:'处理失败','awaiting-notice':'等待通知','awaiting-review':'待管理员审阅','notice-incomplete':'候选已保存，通知未完成','building-pr':'正在生成数据 PR','awaiting-publish':'等待批准上线',publishing:'正在上线',published:'已发布',deployed:'已部署','merged-awaiting-deploy':'已合并，等待站点部署','closed-unmerged':'已关闭，未合并',rejected:'已拒绝',incomplete:'未完整发送',complete:'已完成'},candidate:{ready:'证据充分',uncertain:'需要核实','insufficient-evidence':'证据不足',unknown:'状态未记录'},uncertainty:{low:'低',medium:'中',high:'高'},action:{accept:'接受',edit:'采用修正',reject:'拒绝'},change:{'content-added':'新增内容','content-changed':'内容变化','possibly-removed':'可能已删除','node-date-changed':'截止日期变化'},kind:{conference:'会议',journal:'期刊'}};
function label(group,value){return labels[group]?.[value]||`未映射状态（${String(value??'未知')}）`}
function statusLabel(status){return label('status',status)}
function candidateStatusLabel(status){return label('candidate',status)}
function actionLabel(action){return label('action',action)}
function changeLabel(type){return label('change',type)}
function kindLabel(kind){return label('kind',kind)}
function uncertaintyLabel(level){return label('uncertainty',level)}
function reviewableChanges(item){return (item.changes||[]).filter(change=>change.type==='node-date-changed'||(['ready','uncertain'].includes(item.structuredCandidate?.status)&&Array.isArray(change.next?.evidence)&&change.next.evidence.length>0&&Boolean(change.displayHeadingZh||change.next.displayHeadingZh)&&Boolean(change.categoryLabelZh||change.next.categoryLabelZh)))}
async function loadRecipients(){const {recipients}=await api('/api/recipients');$('#recipients').innerHTML=recipients.map(r=>`<div class="recipient row"><strong>${escapeHTML(r.email)}</strong><span class="badge">${statusLabel(r.status)}</span><span class="status">${r.last_error?escapeHTML(r.last_error):''}</span>${r.status==='pending'?`<button data-recipient="${r.id}" data-action="resend">重发验证</button>`:''}${r.status==='enabled'?`<button data-recipient="${r.id}" data-action="test">发送测试邮件</button><button data-recipient="${r.id}" data-action="disable">停用</button>`:''}${r.status==='disabled'?`<button data-recipient="${r.id}" data-action="enable">启用</button>`:''}<button class="danger" data-recipient="${r.id}" data-action="delete">删除</button></div>`).join('')||'<p class="muted">尚未添加收件邮箱。</p>';}
function escapeHTML(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderSection(section){const renderList=items=>`<ul>${(items||[]).map(item=>`<li>${escapeHTML(item.text)}${item.items?.length?renderList(item.items):''}</li>`).join('')}</ul>`;return `<div class="section"><h3>${escapeHTML(section.displayHeadingZh||section.heading)} <span class="badge">${escapeHTML(section.sourceUrl||'')}</span></h3>${(section.blocks||[]).map(block=>block.type==='paragraph'?`<div class="block">${escapeHTML(block.text)}</div>`:block.type==='list'?renderList(block.items):block.type==='table'?`<pre>${escapeHTML(block.rows.map(row=>row.join(' | ')).join('\n'))}</pre>`:block.type==='links'?`<p>${(block.items||[]).filter(item=>String(item.href||'').startsWith('https://')).map(item=>`<a href="${escapeHTML(item.href)}" target="_blank" rel="noreferrer">${escapeHTML(item.label)}</a>`).join(' · ')}</p>`:'').join('')}</div>`;}
function renderStructuredCandidate(value){if(!value)return '<section class="section"><h3>中文结构化状态</h3><p class="banner">原始采集批次：尚未生成经过引文校验的中文结构化摘要。请逐条核对官网原文；原始差异只能追溯；在证据校验通过并生成结构化版本前，不能直接接受或发布。</p></section>';const state=value.status||'unknown',observations=(value.observations||[]).map(item=>`<article class="card"><h4>${escapeHTML(item.titleZh||item.title||item.categoryLabelZh||'官方信息')}</h4>${item.titleZh&&item.title&&item.titleZh!==item.title?`<p class="small muted">官网原标题：${escapeHTML(item.title)}</p>`:''}${item.categoryLabelZh?`<p class="small muted">类别：${escapeHTML(item.categoryLabelZh)}</p>`:''}${item.summary?`<p>${escapeHTML(item.summary)}</p>`:''}${item.value!==undefined?`<pre>${escapeHTML(typeof item.value==='string'?item.value:JSON.stringify(item.value,null,2))}</pre>`:''}${(item.evidence||[]).map(e=>`<blockquote>${escapeHTML(e.quote)}<footer><a href="${escapeHTML(e.sourceUrl)}" target="_blank" rel="noreferrer">官网原文：${escapeHTML(e.heading?`h${e.headingLevel||'?'} ${(e.sourceHeadingPath||[e.heading]).join(' › ')}`:e.sourceUrl)}</a></footer></blockquote>`).join('')}</article>`).join('');return `<section class="section"><h3>中文结构化候选 <span class="badge">${escapeHTML(candidateStatusLabel(state))}</span></h3>${value.summary?`<p>${escapeHTML(value.summary)}</p>`:''}${observations||'<p class="muted">当前没有可展示的结构化观察。</p>'}${(value.limitations||[]).map(text=>`<p class="banner">待核实：${escapeHTML(text)}</p>`).join('')}</section>`;}function primaryParagraph(section){return section?.blocks?.find(block=>block.type==='paragraph')?.text||'';}
async function loadBatches(){const {batches}=await api('/api/batches');$('#batches').innerHTML=batches.length?batches.map(b=>`<article class="card"><div class="row"><strong>${escapeHTML(b.id)}</strong><span class="badge">${escapeHTML(statusLabel(b.status))}</span><span class="status">v${b.version} · 通知：${escapeHTML(statusLabel(b.notification_status))}</span></div><p>${escapeHTML(b.created_at)}${b.pr_url?` · <a href="${escapeHTML(b.pr_url)}" target="_blank" rel="noreferrer">查看最终 PR</a>`:''}</p>${b.notification_status!=='complete'?`<button data-notify="${escapeHTML(b.id)}">重试审阅邮件</button>`:''}<button data-batch="${escapeHTML(b.id)}">查看来源与差异</button><div id="batch-${escapeHTML(b.id)}"></div></article>`).join(''):'<p class="muted">目前没有待审更新。</p>';}
async function showBatch(id){const batch=await api(`/api/batches/${encodeURIComponent(id)}`),{payload,decisions}=batch,reviewable=(payload.items||[]).some(item=>reviewableChanges(item).length),unstructuredItems=(payload.items||[]).filter(item=>(item.changes||[]).length&&!reviewableChanges(item).length),container=$(`#batch-${CSS.escape(id)}`),rows=[];for(const item of payload.items||[]){const itemDecisions=decisions[item.entity.id]||{},formalChanges=reviewableChanges(item),rawChanges=Array.isArray(item.sourceChanges)?item.sourceChanges:(item.changes||[]).filter(change=>!formalChanges.some(formal=>formal.sectionId===change.sectionId));const raw=rawChanges.length?`<details class="section"><summary>原始采集差异（仅供追溯，不直接参与发布）</summary>${rawChanges.map(change=>`<p>${escapeHTML(changeLabel(change.type))} · ${escapeHTML(change.displayHeadingZh||change.heading||change.sectionId)} · ${escapeHTML(change.sourceUrl||'')}</p>${change.displayHeadingZh&&change.heading?`<p class="small muted">官网原标题：${escapeHTML(change.heading)}</p>`:''}${change.old?renderSection(change.old):''}${change.next?renderSection(change.next):''}`).join('')}</details>`:'';rows.push(`<div class="section"><h3>${escapeHTML(item.entity.id)} · ${escapeHTML(kindLabel(item.entity.kind))}</h3>${(item.failures||[]).map(f=>`<p class="error">采集失败：${escapeHTML(f.url)}：${escapeHTML(f.message)}</p>`).join('')}${renderStructuredCandidate(item.structuredCandidate)}${raw}${formalChanges.map(change=>`<div class="card" data-section="${escapeHTML(JSON.stringify(change.next||{}))}" data-id="${escapeHTML(change.sectionId)}" data-entity="${escapeHTML(item.entity.id)}"><strong>${escapeHTML(changeLabel(change.type))} · ${escapeHTML(change.displayHeadingZh||change.heading||change.next?.displayHeadingZh||change.next?.heading||change.old?.heading||change.sectionId)}</strong>${change.displayHeadingZh&&change.heading?`<p class="small muted">官网原标题：${escapeHTML(change.heading)}</p>`:''}<p class="small">来源：${escapeHTML(change.sourceUrl||change.next?.sourceUrl||change.old?.sourceUrl||'')}</p>${change.conflict?'<p class="error">与已发布内容存在冲突，请核对证据。</p>':''}${change.type==='node-date-changed'?`<p>截止日期：${escapeHTML(change.oldDate||'未设置')} → ${escapeHTML(change.nextDate)}</p><label class="small muted">修正日期<input class="date-correction" type="date" value="${escapeHTML(itemDecisions[change.sectionId]?.date||change.nextDate)}"></label>`:change.old?renderSection(change.old):''}${change.type!=='node-date-changed'&&change.next?renderSection(change.next)+`<label class="small muted">编辑候选内容（官网来源和原文依据会保留）<textarea class="correction">${escapeHTML(primaryParagraph(itemDecisions[change.sectionId]?.section||change.next))}</textarea></label>`:''}<button class="decision" data-decision="accept">接受</button>${change.next||change.type==='node-date-changed'?`<button class="decision" data-decision="edit">采用我的修正</button>`:''}<button class="decision" data-decision="reject">拒绝</button><span class="badge">当前：${escapeHTML(actionLabel(itemDecisions[change.sectionId]?.action)||'待处理')}</span></div>`).join('')}${(item.gaps||[]).map(g=>`<p class="banner">采集缺口：${escapeHTML(g)}</p>`).join('')}</div>`);}
const historyHtml=(batch.reviewHistory||[]).map(entry=>{const action=({"batch.decisions":"已提交审阅结果","batch.rejected":"已拒绝批次","batch.approve-publish":"已批准最终版本","batch.manual-merge-reconciled":"已记录人工合并"})[entry.action]||'审阅记录';return `<li>${escapeHTML(action)} · ${escapeHTML(entry.actor)} · ${escapeHTML(entry.created_at)}${entry.details?.version?` · v${escapeHTML(entry.details.version)}`:''}</li>`}).join('');const historyPanel=historyHtml?`<section class="section"><h3>处理记录</h3><ul>${historyHtml}</ul></section>`:'';let release='';if(batch.pr_url){let classification={reviewable:false,reason:'classification-unavailable',files:[]};try{classification=await api(`/api/batches/${encodeURIComponent(id)}/classification`)}catch{}const canReview=Boolean(classification.reviewable&&classification.diffDigest&&batch.final_sha),files=(classification.files||[]).map(file=>`<details class="section"><summary>${escapeHTML(file.filename)} · +${escapeHTML(file.additions)} / −${escapeHTML(file.deletions)}</summary><pre>${escapeHTML(file.patch||'GitHub 未提供可内嵌补丁；请打开最终 PR 查看完整差异。')}</pre></details>`).join('');release=`<p class="banner">最终 PR 差异已从 GitHub 重新读取并绑定。最终 SHA：<code>${escapeHTML(batch.final_sha||'')}</code> · 通知：${escapeHTML(statusLabel(batch.notification_status||'pending'))}（通知状态不影响审阅） · ${escapeHTML(classification.reason||'无法读取差异')}</p>${files}<p><a href="${escapeHTML(batch.pr_url)}" target="_blank" rel="noreferrer">在 GitHub 查看最终 PR</a></p>${batch.status==='awaiting-review'&&canReview?`<button class="primary" data-approve="${escapeHTML(id)}" data-sha="${escapeHTML(batch.final_sha||'')}" data-diff-digest="${escapeHTML(classification.diffDigest)}">我已审阅最终差异：批准并按仓库规则上线</button>`:batch.status==='awaiting-review'?'<p class="error">最终差异未完整加载，暂不能提交批准。</p>':''}`;}if(batch.merged_sha)release+=`<p class="small">合并提交：<code>${escapeHTML(batch.merged_sha)}</code> · ${escapeHTML(batch.merged_at||'')} · 站点部署：${escapeHTML(statusLabel(batch.deployment_status||'pending'))}</p>`;container.innerHTML=historyPanel+rows.join('')+(release|| (reviewable&&batch.status==='awaiting-review'?`<p class="banner">保存取舍后，系统将生成并检查正式 YAML PR。</p><button class="primary" data-save="${escapeHTML(id)}">提交审阅结果</button>`:`<p class="banner">${reviewable?'当前批次状态：'+escapeHTML(statusLabel(batch.status)):unstructuredItems.length?'原始候选未通过结构化证据校验，不能直接接受或发布。请使用 GitHub Actions 的“Copilot structured official updates”，填写 retry_batch_id 重新整理。':'没有可审阅的变更；失败来源可在采集重试队列中恢复。'} · 邮件通知：${escapeHTML(statusLabel(batch.notification_status))}</p>`));}
async function refresh(){try{const s=await api('/api/session');$('#signed-out').classList.add('hidden');$('#app').classList.remove('hidden');$('#login').classList.add('hidden');$('#logout').classList.remove('hidden');$('#status').textContent=`GitHub 管理员：${s.login} · 项目：${s.project} · 启用收件人：${s.enabledRecipients} · 邮件服务：${s.mailReady?'已配置':'待配置'} · 最近成功采集：${s.lastSuccessfulRun||'尚无记录'}`;await Promise.all([loadRecipients(),loadBatches()]);}catch{$('#signed-out').classList.remove('hidden');$('#app').classList.add('hidden');$('#login').classList.remove('hidden');$('#logout').classList.add('hidden');}}
$('#login').onclick=()=>location.href='/auth/github';$('#logout').onclick=async()=>{await api('/auth/logout',{method:'POST',body:'{}'});location.reload()};
$('#add-email').onsubmit=async event=>{event.preventDefault();try{const email=new FormData(event.currentTarget).get('email');const result=await api('/api/recipients',{method:'POST',body:JSON.stringify({email})});msg(result.verificationSent?'验证邮件已发送。':'邮箱已保存为待验证；邮件服务尚未成功发送。',!result.verificationSent);event.currentTarget.reset();await loadRecipients()}catch(error){msg(error.message,true)}};
document.addEventListener('click',async event=>{const b=event.target.closest('button');if(!b)return;try{if(b.dataset.recipient){const id=b.dataset.recipient,action=b.dataset.action;if(action==='resend'){const r=await api(`/api/recipients/${id}/resend-verification`,{method:'POST',body:'{}'});msg(r.verificationSent?'验证邮件已发送。':r.mailError,true)}else if(action==='test'){const r=await api(`/api/recipients/${id}/test`,{method:'POST',body:'{}'});msg(r.sent?'测试邮件已发送。':r.error,true)}else if(action==='delete'){await api(`/api/recipients/${id}`,{method:'DELETE'});msg('邮箱已删除。')}else{await api(`/api/recipients/${id}`,{method:'PATCH',body:JSON.stringify({status:action==='enable'?'enabled':'disabled'})});msg('邮箱状态已更新。')}await loadRecipients()}if(b.dataset.notify){const r=await api(`/api/batches/${encodeURIComponent(b.dataset.notify)}/notify`,{method:'POST',body:'{}'});msg(r.complete?'本批邮件通知已完整发送。':'邮件仍未完整送达。',!r.complete);await loadBatches()}if(b.dataset.approve){const r=await api(`/api/batches/${encodeURIComponent(b.dataset.approve)}/approve-publish`,{method:'POST',body:JSON.stringify({finalSha:b.dataset.sha,reviewedDiffDigest:b.dataset.diffDigest})});msg(r.message);await loadBatches()}if(b.dataset.batch)await showBatch(b.dataset.batch);if(b.dataset.decision){const c=b.closest('.card');c.dataset.action=b.dataset.decision;c.querySelector('.badge').textContent=({accept:'接受',edit:'采用修正',reject:'拒绝'})[b.dataset.decision];}if(b.dataset.save){const card=$(`#batch-${CSS.escape(b.dataset.save)}`),decisions={};for(const row of card.querySelectorAll('.card[data-id][data-section]')){const action=row.dataset.action;if(!action)continue;const entity=row.dataset.entity,entityDecisions=decisions[entity]||(decisions[entity]={});if(action==='edit'){const date=row.querySelector('.date-correction');if(date){entityDecisions[row.dataset.id]={action:'edit',date:date.value};continue;}const section=JSON.parse(row.dataset.section||'{}'),text=row.querySelector('.correction')?.value||'',block=section.blocks?.find(x=>x.type==='paragraph');if(block)block.text=text;else if(text)section.blocks=[...(section.blocks||[]),{type:'paragraph',text}];entityDecisions[row.dataset.id]={action:'edit',section}}else entityDecisions[row.dataset.id]={action};}const result=await api(`/api/batches/${encodeURIComponent(b.dataset.save)}/decisions`,{method:'PUT',body:JSON.stringify({decisions})});msg(`已保存 v${result.version} 取舍。${result.message}`);await loadBatches()}}catch(error){msg(error.message,true)}});
const verification=location.hash.match(/verify=([^&]+)/);if(verification){api('/api/verify',{method:'POST',body:JSON.stringify({token:decodeURIComponent(verification[1])})}).then(()=>msg('邮箱验证成功。')).catch(error=>msg(error.message,true)).finally(()=>{history.replaceState(null,'',location.pathname);refresh()})}else refresh();
</script></body></html>
