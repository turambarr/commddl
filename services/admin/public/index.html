<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CommDDL 管理员审阅</title><style>
:root{font:15px/1.65 system-ui,-apple-system,"PingFang SC",sans-serif;color:#203d3b;background:#f1f6f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:0 auto;padding:32px 20px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:24px;margin:0}h2{font-size:18px;margin:28px 0 12px}.muted{color:#6d8480}button,input,select{font:inherit}button{border:1px solid #c9dad3;background:#fff;border-radius:7px;padding:8px 12px;color:#204d45;cursor:pointer}button.primary{background:#17665b;color:#fff;border-color:#17665b}.panel,.card{background:white;border:1px solid #dce7e2;border-radius:12px;padding:18px;margin:14px 0}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.row input[type=email]{min-width:240px;flex:1;padding:9px;border:1px solid #c9dad3;border-radius:7px}.status{font-size:12px;color:#607b75}.recipient,.batch-item{border-top:1px solid #e7eeeb;padding:12px 0}.badge{border-radius:20px;padding:2px 9px;background:#edf4f0;font-size:12px}.error{color:#a33525}.success{color:#23764d}.section{border-top:1px solid #e7eeeb;padding:14px 0}.section h3{font-size:15px;margin:0 0 5px}.block{padding:9px 12px;background:#f7faf8;border-radius:6px;margin:6px 0;white-space:pre-wrap}.danger{color:#963526}.hidden{display:none!important}pre{white-space:pre-wrap;overflow-wrap:anywhere}.decision{margin:7px 5px 5px 0}.correction{width:100%;min-height:88px;padding:9px;border:1px solid #c9dad3;border-radius:7px;font:inherit}.top-actions{display:flex;gap:8px}.banner{padding:12px 14px;border-radius:8px;background:#fff6df;color:#765518;margin:14px 0}.small{font-size:12px}.object-list{display:grid;gap:9px;margin-top:12px}.object-card{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;width:100%;padding:14px}.object-meta{display:grid;gap:2px}.fact-card{border:1px solid #dce7e2;border-radius:9px;padding:14px;margin:12px 0;background:#fff}.fact-card[data-action="accept"]{border-left:4px solid #318363}.fact-card[data-action="reject"]{border-left:4px solid #bd6857}.fact-card[data-action="edit"]{border-left:4px solid #c59840}.fact-value{padding:9px 12px;border-radius:6px;background:#f7faf8;white-space:pre-wrap}.fact-tools{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.filter{padding:8px;border:1px solid #c9dad3;border-radius:7px;background:#fff}.object-filter{flex:1;min-width:200px}.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.editor{margin-top:10px}.run-summary{display:flex;flex-wrap:wrap;gap:7px}.run-summary .badge{white-space:nowrap}@media(max-width:600px){.wrap{padding:22px 14px}.panel,.card{padding:14px}header{align-items:flex-start;flex-direction:column}.diff-grid{grid-template-columns:1fr}}
</style></head>
<body><main class="wrap"><header><div><p class="muted">COMMDDL · 维护工作台</p><h1>更新审阅与管理员通知</h1></div><div class="top-actions"><button id="login" class="primary">使用 GitHub 账号登录</button><button id="logout" class="hidden">退出登录</button></div></header><div id="message" role="status" class="banner hidden"></div><section id="signed-out" class="panel"><p>请使用仓库所有者或所有者授权且具备目标仓库写入权限的维护者账号登录。邮箱只用于接收更新提醒，不授予仓库权限。</p></section><div id="app" class="hidden"><p id="status" class="muted"></p><section class="panel"><h2>维护者收件邮箱</h2><form id="add-email" class="row"><input type="email" name="email" placeholder="name@example.com" required><button class="primary">添加并发送验证邮件</button></form><p class="small muted">邮件只用于提醒待审内容；发信未配置时，候选仍会进入后台供管理员审阅。</p><div id="recipients"></div></section><section><h2>待审更新批次</h2><div id="batches"></div></section></div></main><script>
</script><script src="/admin.js" defer></script></body></html>
